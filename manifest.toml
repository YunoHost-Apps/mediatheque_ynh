#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "mediatheque"
name = "Médiathèque"
description.fr = "Médiathèque personnelle : films, envies, magazines, jeux vidéo, livres, BD…"
description.en = "Personal media library: movies, wishlist, magazines, video games, books, comics…"

version = "0.8.18~ynh1"

maintainers = ["Stéphane MATER"]

[upstream]
license = "GPL-3.0-or-later"
code = "https://github.com/daryl40000/mediatheque"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "300M"
ram.build = "50M"
ram.runtime = "100M"

[install]

    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/daryl40000/mediatheque/archive/refs/tags/0.8.18.tar.gz"
    sha256 = "3120a7c21c505e80c2d0dc689e1674e4261b33ae1de588e9e0242adf0c2f4d18"
    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"
    
    [resources.data_dir]
    subdirs = ["posters", "media", "sessions", "auth_rate_limit", "install_seed"]

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "php8.5-sqlite3, php8.5-mbstring, php8.5-intl, php8.5-curl, php8.5-zip, poppler-utils"
